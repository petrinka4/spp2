services:
  mongo:
    image: mongo:7
    container_name: spp-lab3-mongo
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db
    ports:
      - "27017:27017"
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.runCommand({ ping: 1 }).ok"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  mailpit:
    image: axllent/mailpit:latest
    container_name: spp-lab3-mailpit
    restart: unless-stopped
    ports:
      - "8025:8025"

  server:
    build: ./server
    container_name: spp-lab3-server
    restart: unless-stopped
    environment:
      PORT: 3000
      MONGO_URI: mongodb://mongo:27017/spp_lab3
      APP_URL: http://localhost:8080
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
      ACCESS_TOKEN_TTL: 15m
      REFRESH_TOKEN_DAYS: 7
      MAX_SESSIONS: 5
      MAX_LOGIN_ATTEMPTS: 5
      LOCK_MINUTES: 15
      SMTP_HOST: mailpit
      SMTP_PORT: 1025
      MAIL_FROM: "Планировщик <no-reply@spp.local>"
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@spp.local}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin12345}
      LOG_LEVEL: info
    volumes:
      - uploads_data:/app/uploads
    depends_on:
      mongo:
        condition: service_healthy
      mailpit:
        condition: service_started
    ports:
      - "3000:3000"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/api/health').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s

  client:
    build: ./client
    container_name: spp-lab3-client
    restart: unless-stopped
    depends_on:
      server:
        condition: service_healthy
    ports:
      - "8080:80"
      - "80:80"

volumes:
  mongo_data:
  uploads_data:
