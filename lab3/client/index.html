<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark" />
    <title>Планировщик задач</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="page-shell">
      <header class="topbar">
        <div>
          <p class="eyebrow">Лабораторная работа №3</p>
          <h1>Планировщик</h1>
        </div>

        <div id="user-box" class="user-box hidden">
          <div class="user-box__info">
            <span id="user-name" class="user-box__name"></span>
            <span id="user-role" class="role-badge"></span>
          </div>
          <button type="button" id="sessions-btn" class="button button-secondary">Сессии</button>
          <button type="button" id="logout-btn" class="button button-secondary">Выйти</button>
        </div>
      </header>

      <div
        id="alert"
        class="notice hidden"
        role="status"
        aria-live="polite"
        aria-atomic="true"
      ></div>

      <section id="auth-view" class="auth-view hidden">
        <div class="panel auth-panel">
          <div class="auth-tabs" role="tablist">
            <button type="button" class="auth-tab is-active" data-auth-tab="login">Вход</button>
            <button type="button" class="auth-tab" data-auth-tab="register">Регистрация</button>
          </div>

          <form id="login-form" class="auth-form" data-auth-form="login" novalidate>
            <label class="field">
              <span>Email</span>
              <input type="email" name="email" autocomplete="username" required />
            </label>
            <label class="field">
              <span>Пароль</span>
              <input type="password" name="password" autocomplete="current-password" required />
            </label>
            <button type="submit" class="button button-primary">Войти</button>
            <button type="button" class="link-button" data-auth-tab="forgot">Забыли пароль?</button>
          </form>

          <form id="register-form" class="auth-form hidden" data-auth-form="register" novalidate>
            <label class="field">
              <span>Имя</span>
              <input type="text" name="name" maxlength="60" autocomplete="name" required />
            </label>
            <label class="field">
              <span>Email</span>
              <input type="email" name="email" autocomplete="username" required />
            </label>
            <label class="field">
              <span>Пароль</span>
              <input type="password" name="password" autocomplete="new-password" required />
              <small>Не менее 8 символов, буквы и цифры</small>
            </label>
            <button type="submit" class="button button-primary">Создать аккаунт</button>
          </form>

          <form id="forgot-form" class="auth-form hidden" data-auth-form="forgot" novalidate>
            <p class="auth-hint">Укажите email — мы отправим ссылку для смены пароля.</p>
            <label class="field">
              <span>Email</span>
              <input type="email" name="email" autocomplete="username" required />
            </label>
            <button type="submit" class="button button-primary">Отправить ссылку</button>
            <button type="button" class="link-button" data-auth-tab="login">Назад ко входу</button>
          </form>

          <form id="reset-form" class="auth-form hidden" data-auth-form="reset" novalidate>
            <p class="auth-hint">Придумайте новый пароль.</p>
            <label class="field">
              <span>Новый пароль</span>
              <input type="password" name="password" autocomplete="new-password" required />
              <small>Не менее 8 символов, буквы и цифры</small>
            </label>
            <button type="submit" class="button button-primary">Сменить пароль</button>
          </form>
        </div>
      </section>

      <div id="app-view" class="hidden">
        <main class="workspace">
          <aside class="panel editor-panel">
            <div class="panel-heading">
              <p class="section-label">Редактор</p>
              <h2 id="form-title">Добавить задачу</h2>
            </div>

            <form id="task-form" novalidate>
              <label class="field">
                <span>Название</span>
                <input
                  type="text"
                  id="title"
                  name="title"
                  maxlength="120"
                  placeholder="Например, подготовить отчёт"
                  autocomplete="off"
                  required
                />
              </label>

              <label class="field">
                <span>Описание</span>
                <textarea
                  id="description"
                  name="description"
                  maxlength="2000"
                  rows="5"
                  placeholder="Кратко опишите задачу"
                ></textarea>
              </label>

              <label class="field">
                <span>Состояние</span>
                <select id="status" name="status">
                  <option value="todo">Запланировано</option>
                  <option value="in_progress">В процессе</option>
                  <option value="done">Завершено</option>
                </select>
              </label>

              <label class="field file-field">
                <span>Вложение</span>
                <input
                  type="file"
                  id="attachment"
                  name="attachment"
                  accept=".jpg,.jpeg,.png,.gif,.webp,.pdf,.txt,.doc,.docx"
                />
                <small>Изображение, PDF, TXT, DOC или DOCX — до 5 МБ</small>
              </label>

              <p id="current-file" class="current-file hidden"></p>

              <div class="form-actions">
                <button type="submit" id="submit-btn" class="button button-primary">
                  Добавить
                </button>

                <button
                  type="button"
                  id="cancel-btn"
                  class="button button-secondary hidden"
                >
                  Отменить
                </button>
              </div>
            </form>
          </aside>

          <section class="panel list-panel" aria-labelledby="list-title">
            <div class="list-heading">
              <div>
                <p class="section-label" id="list-label">Текущая работа</p>
                <h2 id="list-title">Список задач</h2>
              </div>

              <span id="tasks-count" class="counter">0 задач</span>
            </div>

            <div id="tasks" class="task-list" aria-live="polite">
              <div class="empty-state">Загрузка задач…</div>
            </div>
          </section>
        </main>

        <section id="sessions-panel" class="panel extra-panel hidden">
          <div class="list-heading">
            <div>
              <p class="section-label">Безопасность</p>
              <h2>Активные сессии</h2>
            </div>
            <button type="button" id="revoke-others-btn" class="button button-secondary">
              Завершить остальные
            </button>
          </div>
          <div id="sessions-list" class="table-wrap"></div>
        </section>

        <section id="users-panel" class="panel extra-panel hidden">
          <div class="list-heading">
            <div>
              <p class="section-label">Администрирование</p>
              <h2>Пользователи</h2>
            </div>
          </div>
          <div id="users-list" class="table-wrap"></div>
        </section>
      </div>
    </div>

    <script src="app.js"></script>
  </body>
</html>
